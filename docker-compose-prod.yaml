services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb-prod

    ports:
      - "27017:27017"

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-api:
    image: trongiuh/product-api:latest
    container_name: product-api-prod

    ports:
      - "3000:3000"

    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/productdb

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5