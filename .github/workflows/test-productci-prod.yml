name: Test Product CI Prod

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check models/Product.js

      - name: Start Product API
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API did not become healthy"
          cat server.log
          exit 1

      - name: Test Product CRUD
        run: |
          echo "1. CREATE PRODUCT"
          CREATE=$(curl -fsS -X POST http://127.0.0.1:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":1,"pname":"Laptop Dell","price":15990000,"quantity":10}')

          echo "$CREATE"
          echo "$CREATE" | grep -q '"pid":1'


          echo "2. READ PRODUCT"
          READ=$(curl -fsS http://127.0.0.1:3000/products/1)

          echo "$READ"
          echo "$READ" | grep -q '"pname":"Laptop Dell"'


          echo "3. UPDATE PRODUCT"
          UPDATE=$(curl -fsS -X PUT http://127.0.0.1:3000/products/1 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Laptop Dell XPS","price":20000000,"quantity":5}')

          echo "$UPDATE"
          echo "$UPDATE" | grep -q '"pname":"Laptop Dell XPS"'
          echo "$UPDATE" | grep -q '"quantity":5'


          echo "4. DELETE PRODUCT"
          DELETE=$(curl -fsS -X DELETE http://127.0.0.1:3000/products/1)

          echo "$DELETE"
          echo "$DELETE" | grep -q '"message":"Product deleted successfully"'

      - name: Show server log if CI fails
        if: failure()
        run: cat server.log || true