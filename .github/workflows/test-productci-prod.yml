name: Test Product CI Prod

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  # =========================
  # CI - TEST ỨNG DỤNG
  # =========================
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8

        ports:
          - 27017:27017

        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check models/Product.js

      - name: Start Product API
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi

            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API did not become healthy"
          cat server.log
          exit 1

      - name: Test Product CRUD-Changes
        run: |
          echo "1. CREATE PRODUCT"
          CREATE=$(curl -fsS -X POST http://127.0.0.1:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":1,"pname":"Laptop Dell","price":15990000,"quantity":10}')

          echo "$CREATE"
          echo "$CREATE" | grep -q '"pid":1'


          echo "2. READ PRODUCT"
          READ=$(curl -fsS http://127.0.0.1:3000/products/1)

          echo "$READ"
          echo "$READ" | grep -q '"pname":"Laptop Dell"'


          echo "3. UPDATE PRODUCT"
          UPDATE=$(curl -fsS -X PUT http://127.0.0.1:3000/products/1 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Laptop Dell XPS","price":20000000,"quantity":5}')

          echo "$UPDATE"
          echo "$UPDATE" | grep -q '"pname":"Laptop Dell XPS"'
          echo "$UPDATE" | grep -q '"quantity":5'


          echo "4. DELETE PRODUCT"
          DELETE=$(curl -fsS -X DELETE http://127.0.0.1:3000/products/1)

          echo "$DELETE"
          echo "$DELETE" | grep -q '"message":"Product deleted successfully"'

      - name: Show server log if CI fails
        if: failure()
        run: cat server.log || true


  # =========================
  # CD - ĐẨY IMAGE LÊN DOCKER HUB
  # =========================
  build-and-push:
    needs: integration-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest

  deploy-local:
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest image from Docker Hub
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Restart production containers
        run: docker compose -f docker-compose-prod.yaml up -d --force-recreate

      - name: Show production container status
        run: docker compose -f docker-compose-prod.yaml ps